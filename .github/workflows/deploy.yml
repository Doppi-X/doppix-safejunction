# Deploy on every push to main: our GPU server (self-hosted runner) pulls this commit, restarts the
# backend, builds the frontend and publishes it to the Hugging Face Space. Each run is the deployment record.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: [self-hosted, gpu]
    env:
      SERVER_CHECKOUT: D:\My_projects\doppix-safejunction
      PYTHON: D:\My_projects\Train_yolo\venv\Scripts\python.exe
      HF_TOKEN_FILE: D:\My_projects\safejunction_state\hf_token.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Backend - move the server checkout to this commit
        shell: cmd
        run: |
          REM fetch from the runner's fresh checkout on the same disk (no second download from GitHub)
          git -c safe.directory=* -C "%SERVER_CHECKOUT%" fetch -q "%GITHUB_WORKSPACE%" ${{ github.sha }}
          git -c safe.directory=* -C "%SERVER_CHECKOUT%" reset -q --hard ${{ github.sha }}
          git -c safe.directory=* -C "%SERVER_CHECKOUT%" log --oneline -1

      - name: Backend - restart the service
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deploy\restart.ps1

      - name: Frontend - build
        shell: cmd
        working-directory: frontend
        run: |
          call npm install --no-audit --no-fund
          call npm run build

      - name: Frontend - publish to Hugging Face
        shell: cmd
        run: '"%PYTHON%" deploy\push_site.py'

      - name: Smoke test
        shell: powershell
        run: |
          $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7870/api/health
          $h.Content
          $s = Invoke-WebRequest -UseBasicParsing https://giyos1212-safejunction.static.hf.space/
          "site HTTP $($s.StatusCode)"
